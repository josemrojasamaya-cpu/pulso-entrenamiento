<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pulso">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4a8ee0"/>
      <stop offset="55%"  stop-color="#2c62aa"/>
      <stop offset="100%" stop-color="#12304f"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#fondo)"/>
  <rect width="512" height="512" rx="118" fill="url(#brillo)"/>

  <!-- La línea de latido ES la barra: el trazo del pulso atraviesa el
       centro y se apoya en los discos. Las dos ideas del nombre en una
       sola figura. -->
  <g fill="none" stroke="#ffffff" stroke-width="20"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 256 H166 L192 202 L228 312 L264 180 L298 290 L322 256 H404"/>
  </g>

  <g fill="#ffffff">
    <rect x="66"  y="194" width="30" height="124" rx="15"/>
    <rect x="416" y="194" width="30" height="124" rx="15"/>
  </g>
  <g fill="#ffffff" opacity=".6">
    <rect x="106" y="216" width="20" height="80" rx="10"/>
    <rect x="386" y="216" width="20" height="80" rx="10"/>
  </g>
</svg>
