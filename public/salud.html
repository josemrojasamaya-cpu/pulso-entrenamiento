<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1620">
<title>Pulso · Salud y dispositivos</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
.solapas-s{display:flex; gap:4px; padding:4px; margin-bottom:18px;
  background:var(--gr-850); border:1px solid var(--borde); border-radius:11px; overflow-x:auto}
.solapas-s button{
  flex:1; min-width:88px; padding:9px 8px; border:none; border-radius:8px; cursor:pointer;
  background:none; color:var(--tx2); font:inherit; font-size:13px; font-weight:600; white-space:nowrap;
}
.solapas-s button.on{background:var(--az); color:#fff}
.panel-s{display:none} .panel-s.on{display:block}

/* Agua */
.vaso-grande{
  position:relative; width:150px; height:190px; margin:0 auto 16px;
  border:3px solid var(--borde); border-top:none;
  border-radius:0 0 22px 22px; overflow:hidden; background:var(--gr-900);
}
.agua{
  position:absolute; left:0; right:0; bottom:0;
  background:linear-gradient(180deg,#4a8ee0,#1b5fa8);
  transition:height .5s cubic-bezier(.3,.8,.4,1);
}
.agua::before{
  content:""; position:absolute; top:-7px; left:0; right:0; height:14px;
  background:#5c9ce8; border-radius:50%; opacity:.8;
}
.vaso-txt{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:2;
}
.vaso-txt b{font-size:27px; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.6)}
.vaso-txt span{font-size:12.5px; color:var(--tx2); text-shadow:0 1px 4px rgba(0,0,0,.6)}

.botones-agua{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px}
.btn-agua{
  padding:13px 8px; border:1px solid var(--borde); border-radius:11px;
  background:var(--gr-750); color:var(--tx); font:inherit; cursor:pointer; transition:.15s;
}
.btn-agua:hover{border-color:var(--az); background:var(--az-tenue)}
.btn-agua b{display:block; font-size:15px; font-weight:700}
.btn-agua span{display:block; font-size:11px; color:var(--tx3)}

.barras-sem{display:flex; align-items:flex-end; gap:5px; height:76px; margin-top:12px}
.barra-sem{flex:1; display:flex; flex-direction:column; justify-content:flex-end;
  align-items:center; gap:4px; height:100%}
.barra-sem .col{width:100%; background:linear-gradient(180deg,#4a8ee0,#1b5fa8);
  border-radius:4px 4px 0 0; min-height:3px}
.barra-sem .col.meta{background:linear-gradient(180deg,var(--ok),#1d7a54)}
.barra-sem .et{font-size:9.5px; color:var(--tx3)}

/* Dispositivos */
.disp{
  display:flex; align-items:center; gap:13px; padding:13px 0;
  border-bottom:1px solid var(--borde);
}
.disp:last-child{border-bottom:none}
.disp .ico{
  width:38px; height:38px; border-radius:11px; flex:none; display:grid; place-items:center;
  background:var(--gr-750);
}
.disp .ico svg{width:19px; height:19px; stroke:var(--az); fill:none; stroke-width:1.9}
.disp .tx{flex:1; min-width:0}
.disp .tx b{display:block; font-size:14.5px; font-weight:650}
.disp .tx span{font-size:12px; color:var(--tx3)}

.vivo{
  background:linear-gradient(150deg,var(--az-tenue),var(--gr-850));
  border:1px solid var(--az-3); border-radius:var(--radio);
  padding:20px; text-align:center; margin-bottom:14px;
}
.vivo .bpm{font-size:52px; font-weight:800; line-height:1; color:var(--az);
  font-variant-numeric:tabular-nums}
.vivo .bpm small{font-size:16px; color:var(--tx2); font-weight:600}
.latido{display:inline-block; animation:latir 1s ease-in-out infinite}
@keyframes latir{0%,100%{transform:scale(1)}22%{transform:scale(1.18)}44%{transform:scale(1)}}

.zona{display:flex; gap:3px; margin-top:14px}
.zona div{flex:1; height:7px; border-radius:3px; background:var(--gr-750)}
.zona div.on{background:currentColor}

/* Aplicaciones */
.app-f{
  border:1px solid var(--borde); border-radius:13px; background:var(--gr-850);
  margin-bottom:10px; overflow:hidden;
}
.app-cab{
  display:flex; align-items:center; gap:12px; padding:14px 15px; cursor:pointer;
  user-select:none; transition:.15s;
}
.app-cab:hover{background:var(--gr-800)}
.app-cab .letra{
  width:40px; height:40px; border-radius:11px; flex:none; display:grid; place-items:center;
  background:var(--az-tenue); color:var(--az); font-weight:800; font-size:16px;
  border:1px solid var(--az-3);
}
.app-cab .tx{flex:1; min-width:0}
.app-cab .tx b{display:block; font-size:14.5px; font-weight:650}
.app-cab .tx span{font-size:11.5px; color:var(--tx3); display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.app-cab .fl{color:var(--tx3); font-size:12px; transition:transform .2s}
.app-f.abierta .app-cab .fl{transform:rotate(90deg)}
.app-cu{display:none; padding:0 15px 16px; border-top:1px solid var(--borde)}
.app-f.abierta .app-cu{display:block}
.app-cu ol{margin:12px 0 0 18px; padding:0; font-size:13px; line-height:1.7; color:var(--tx2)}
.app-cu ol li{margin-bottom:5px}
.etq-bt{
  display:inline-block; padding:2px 7px; border-radius:5px; font-size:10px; font-weight:700;
  background:var(--az-tenue); color:var(--az); border:1px solid var(--az-3); margin-left:6px;
  vertical-align:middle;
}
.trae{display:flex; flex-wrap:wrap; gap:5px; margin-top:12px}
.trae span{
  font-size:11px; padding:3px 9px; border-radius:20px;
  background:var(--gr-750); color:var(--tx2); border:1px solid var(--borde);
}

/* Galería */
.rejilla-fotos{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.foto{position:relative; border-radius:11px; overflow:hidden; background:var(--gr-850);
  border:1px solid var(--borde); aspect-ratio:3/4}
.foto img{width:100%; height:100%; object-fit:cover; display:block}
.foto .pie{
  position:absolute; left:0; right:0; bottom:0; padding:8px 10px;
  background:linear-gradient(180deg,transparent,rgba(4,7,11,.92));
  font-size:11.5px;
}
.foto .pie b{display:block; font-size:12.5px}
.foto .quitar{
  position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:8px;
  background:rgba(6,10,16,.75); border:none; color:#eda6a3; cursor:pointer; font-size:15px;
}
</style>
</head>
<body>

<header class="top" id="top"></header>

<main class="pagina">
  <div class="titulo">
    <h1>Salud</h1>
    <p>Todo lo que tu cuerpo dice fuera del gimnasio.</p>
  </div>

  <div class="solapas-s">
    <button class="on" onclick="verPanel('agua', this)">Agua</button>
    <button onclick="verPanel('sueno', this)">Sueño</button>
    <button onclick="verPanel('dispositivos', this)">Dispositivos</button>
    <button onclick="verPanel('apps', this)">Apps</button>
    <button onclick="verPanel('fotos', this)">Galería</button>
  </div>

  <div class="panel-s on" id="p-agua"><div class="cargando">Cargando…</div></div>
  <div class="panel-s" id="p-sueno"></div>
  <div class="panel-s" id="p-dispositivos"></div>
  <div class="panel-s" id="p-apps"></div>
  <div class="panel-s" id="p-fotos"></div>
</main>

<nav class="tabs" id="tabs"></nav>

<script src="almacen.js"></script>
<script src="comun.js"></script>
<script>
const usuario = Sesion.exigir();
let agua = null, cargados = {};

function verPanel(cual, boton) {
  document.querySelectorAll(".panel-s").forEach(p => p.classList.remove("on"));
  document.querySelectorAll(".solapas-s button").forEach(b => b.classList.remove("on"));
  document.getElementById("p-" + cual).classList.add("on");
  boton.classList.add("on");
  if (!cargados[cual]) { cargados[cual] = true; cargar(cual); }
}

function cargar(cual) {
  if (cual === "agua") verAgua();
  if (cual === "sueno") verSueno();
  if (cual === "dispositivos") verDispositivos();
  if (cual === "apps") verApps();
  if (cual === "fotos") verFotos();
}

/* ── Agua ─────────────────────────────────────────────────────────── */

async function verAgua() {
  try { agua = await api("/salud/agua"); }
  catch (err) {
    document.getElementById("p-agua").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
    return;
  }

  const maxSem = Math.max(agua.meta, ...agua.semana.map(d => d.total), 1);
  const dias = ["dom","lun","mar","mié","jue","vie","sáb"];

  document.getElementById("p-agua").innerHTML = `
    <div class="tarjeta" style="margin-bottom:16px"><div class="t-cu">
      <div class="vaso-grande">
        <div class="agua" style="height:${agua.porcentaje}%"></div>
        <div class="vaso-txt">
          <b>${(agua.hoy / 1000).toFixed(1)} L</b>
          <span>de ${(agua.meta / 1000).toFixed(1)} L</span>
        </div>
      </div>

      <div style="text-align:center; font-size:13px; color:var(--tx2); margin-bottom:14px">
        ${agua.hoy >= agua.meta
          ? "Meta cumplida. Buen trabajo."
          : `Te faltan ${((agua.meta - agua.hoy) / 1000).toFixed(1)} L · ${agua.veces} ${agua.veces === 1 ? "vez" : "veces"} hoy`}
      </div>

      <div class="botones-agua">
        <button class="btn-agua" onclick="tomar(${Math.round(agua.vaso / 2)})">
          <b>½</b><span>${Math.round(agua.vaso / 2)} ml</span></button>
        <button class="btn-agua" onclick="tomar(${agua.vaso})">
          <b>1 vaso</b><span>${agua.vaso} ml</span></button>
        <button class="btn-agua" onclick="tomar(${agua.vaso * 2})">
          <b>Botella</b><span>${agua.vaso * 2} ml</span></button>
      </div>
      ${agua.veces > 0 ? `<button class="btn sec chico" onclick="deshacerAgua()"
        style="width:100%">Deshacer el último</button>` : ""}
    </div></div>

    <div class="tarjeta" style="margin-bottom:16px">
      <div class="t-cab"><h2>Últimos siete días</h2></div>
      <div class="t-cu">
        <div class="barras-sem">
          ${Array.from({length: 7}, (_, i) => {
            const d = new Date(); d.setDate(d.getDate() - (6 - i));
            const clave = d.toISOString().slice(0, 10);
            const fila = agua.semana.find(x => String(x.fecha).slice(0, 10) === clave);
            const total = fila ? fila.total : 0;
            return `<div class="barra-sem" title="${(total/1000).toFixed(1)} L">
              <div class="col ${total >= agua.meta ? "meta" : ""}"
                   style="height:${Math.max(3, (total / maxSem) * 100)}%"></div>
              <div class="et">${dias[d.getDay()]}</div>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>

    <div class="tarjeta">
      <div class="t-cab"><h2>Tu meta</h2></div>
      <div class="t-cu">
        <p style="font-size:13px; color:var(--tx2); line-height:1.55; margin-bottom:14px">
          Cuando llegás a tu meta del día ganás <strong style="color:var(--ac)">20 puntos</strong>,
          una sola vez. Los puntos se dan por cumplir, no por tocar el botón.
        </p>
        <div class="rejilla r-2">
          <label class="campo"><span>Meta diaria (ml)</span>
            <input type="number" id="meta-agua" value="${agua.meta}" step="100" min="500" max="8000"></label>
          <label class="campo"><span>Tu vaso (ml)</span>
            <input type="number" id="vaso-agua" value="${agua.vaso}" step="50" min="50" max="2000"></label>
        </div>
        <button class="btn sec" onclick="guardarAgua()" style="width:100%">Guardar</button>
        <div id="agua-msg" style="margin-top:10px"></div>
        <div id="agua-premio" style="margin-top:10px"></div>
      </div>
    </div>`;
}

async function tomar(ml) {
  try {
    const r = await api("/salud/agua", { method: "POST", body: { ml } });
    agua.hoy = r.hoy; agua.veces++;
    agua.porcentaje = Math.min(100, Math.round((r.hoy / agua.meta) * 100));
    await verAgua();
    if (navigator.vibrate) navigator.vibrate(35);

    if (r.puntos_ganados) {
      const c = document.getElementById("agua-premio");
      if (c) c.innerHTML =
        `<div class="aviso ok">Meta cumplida. +${r.puntos_ganados} puntos.</div>`;
    }
  } catch (err) { alert(err.message); }
}

async function deshacerAgua() {
  try { await api("/salud/agua/ultimo", { method: "DELETE" }); verAgua(); }
  catch (err) { alert(err.message); }
}

async function guardarAgua() {
  try {
    await api("/salud/agua/preferencias", { method: "PUT", body: {
      meta_agua_ml: Number(document.getElementById("meta-agua").value),
      vaso_ml: Number(document.getElementById("vaso-agua").value)
    }});
    document.getElementById("agua-msg").innerHTML = `<div class="aviso ok">Guardado.</div>`;
    verAgua();
  } catch (err) {
    document.getElementById("agua-msg").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

/* Los recordatorios viven en avisos.js: un solo aviso al día, y sólo si
   la persona lo pidió. La versión anterior mandaba una notificación de
   agua cada noventa minutos, y ese es exactamente el camino por el que
   una aplicación termina desinstalada. */

/* ── Aplicaciones que se pueden traer ─────────────────────────────── */

/**
 * El catálogo no pregunta qué tenés instalado: no hay forma de saberlo
 * desde el navegador, y fingir que sí la hay sería mentira. Se muestran
 * todas, y quien usa una la reconoce de inmediato. Las que no usa le
 * quedan como enlace por si le interesan.
 */
async function verApps() {
  const c = document.getElementById("p-apps");
  let d;
  try { d = await api("/salud/aplicaciones"); }
  catch (err) { c.innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`; return; }

  c.innerHTML = `
    <div class="tarjeta" style="margin-bottom:16px"><div class="t-cu">
      <h3 style="font-size:15px; margin-bottom:8px">Traé tus datos de donde ya los tenés</h3>
      <p style="font-size:13px; color:var(--tx2); line-height:1.6">
        Tus datos son tuyos, y todas estas plataformas están obligadas a dejarte
        bajarlos. Acá abajo están los pasos exactos de cada una: dónde está el
        botón de exportar, qué archivo sale y qué se aprovecha.
      </p>
      <p style="font-size:12.5px; color:var(--tx3); line-height:1.6; margin-top:10px">
        No pedimos tu contraseña de ninguna de ellas y no nos conectamos a sus
        servidores. Vos bajás el archivo y lo subís acá.
      </p>
      <a class="btn sec" href="#" onclick="verPanel('dispositivos', document.querySelectorAll('.solapas-s button')[2]); return false"
         style="display:block; text-align:center; margin-top:14px">Ir a subir un archivo</a>
    </div></div>

    ${d.aplicaciones.map((a, i) => `
      <div class="app-f" id="app-${a.codigo}">
        <div class="app-cab" onclick="document.getElementById('app-${a.codigo}').classList.toggle('abierta')">
          <div class="letra">${esc(a.nombre.charAt(0))}</div>
          <div class="tx">
            <b>${esc(a.nombre)}${a.bluetooth ? '<span class="etq-bt">BLUETOOTH</span>' : ''}</b>
            <span>${esc(a.que_es)}</span>
          </div>
          <div class="fl">&#9654;</div>
        </div>
        <div class="app-cu">
          <div class="trae">${a.trae.map(t => `<span>${esc(t)}</span>`).join("")}</div>

          <p style="font-size:12px; color:var(--tx3); margin-top:14px">
            <strong style="color:var(--tx2)">Sale en:</strong> ${esc(a.formato)}
            &nbsp;·&nbsp; <strong style="color:var(--tx2)">Está en:</strong> ${esc(a.seccion)}
          </p>

          <ol>${a.pasos.map(x => `<li>${esc(x)}</li>`).join("")}</ol>

          ${a.nota ? `<p style="font-size:12.5px; color:var(--tx3); line-height:1.6;
             margin-top:12px; padding:10px 12px; background:var(--gr-800);
             border-left:2px solid var(--az); border-radius:0 8px 8px 0">${esc(a.nota)}</p>` : ""}

          ${a.bluetooth ? `<p style="font-size:12.5px; color:var(--ok); margin-top:12px">
             Esta marca se conecta directo por Bluetooth desde Dispositivos, sin exportar nada.</p>` : ""}

          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:14px">
            ${a.enlace_android ? `<a class="btn sec chico" href="${esc(a.enlace_android)}"
                target="_blank" rel="noopener noreferrer">Descargar (Android)</a>` : ""}
            ${a.enlace_ios ? `<a class="btn sec chico" href="${esc(a.enlace_ios)}"
                target="_blank" rel="noopener noreferrer">Descargar (iPhone)</a>` : ""}
            ${a.sitio ? `<a class="btn sec chico" href="${esc(a.sitio)}"
                target="_blank" rel="noopener noreferrer">Sitio</a>` : ""}
          </div>
        </div>
      </div>`).join("")}

    <div class="tarjeta" style="margin-top:16px"><div class="t-cu">
      <p style="font-size:12.5px; color:var(--tx3); line-height:1.6">
        ¿Usás una que no está en la lista? Si exporta en GPX, TCX o CSV, la
        importación de archivos ya la va a entender aunque no aparezca acá.
      </p>
    </div></div>`;
}

/* ── Sueño ────────────────────────────────────────────────────────── */

async function verSueno() {
  let d;
  try { d = await api("/salud/sueno"); }
  catch (err) {
    document.getElementById("p-sueno").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
    return;
  }

  const max = Math.max(9, ...d.noches.map(n => n.horas));

  document.getElementById("p-sueno").innerHTML = `
    <div class="metricas" style="margin-bottom:16px">
      <div class="metrica">
        <b>${d.promedio_horas !== null ? d.promedio_horas : "—"}<small style="font-size:15px;color:var(--tx3)"> h</small></b>
        <span>Promedio</span>
      </div>
      <div class="metrica">
        <b style="${d.noches_cortas > 3 ? "color:var(--alerta)" : ""}">${d.noches_cortas}</b>
        <span>Noches de menos de 7 h</span>
      </div>
      <div class="metrica"><b>${d.noches.length}</b><span>Noches registradas</span></div>
    </div>

    ${d.promedio_horas !== null && d.promedio_horas < 6.5 ? `
      <div class="aviso alerta" style="margin-bottom:16px">
        <b>Estás durmiendo poco</b>
        Con menos de siete horas, la recuperación entre sesiones se resiente y el riesgo
        de lesión sube. Si venís estancado, esto suele explicar más que el entrenamiento.
      </div>` : ""}

    <div class="tarjeta" style="margin-bottom:16px">
      <div class="t-cab"><h2>Anoche</h2></div>
      <div class="t-cu">
        <div class="rejilla r-2">
          <label class="campo"><span>Cuántas horas dormiste</span>
            <input type="number" id="s-horas" step="0.5" min="0" max="20" placeholder="7.5"></label>
          <label class="campo"><span>Fecha</span>
            <input type="date" id="s-fecha" value="${hoyISO()}"></label>
        </div>
        <button class="btn" onclick="guardarSueno()" style="width:100%">Registrar</button>
        <div id="s-msg" style="margin-top:10px"></div>
        <p style="font-size:12.5px; color:var(--tx3); margin-top:12px; line-height:1.55">
          Si usás reloj o pulsera, no hace falta escribirlo: importá el archivo desde
          la pestaña Dispositivos y el sueño entra solo.
        </p>
      </div>
    </div>

    ${d.noches.length ? `
      <div class="tarjeta">
        <div class="t-cab"><h2>Último mes</h2>
          <div class="der"><span class="eti gris">la línea marca 7 h</span></div>
        </div>
        <div class="t-cu">
          <div class="barras-sem" style="height:110px; position:relative">
            <div style="position:absolute; left:0; right:0; border-top:1px dashed var(--az);
                        opacity:.5; bottom:${(7 / max) * 100}%"></div>
            ${d.noches.slice(-21).map(n => `
              <div class="barra-sem" title="${n.horas} h · ${fecha(n.fecha)}">
                <div class="col ${n.horas < 7 ? "" : "meta"}"
                     style="height:${Math.max(3, (n.horas / max) * 100)}%"></div>
              </div>`).join("")}
          </div>
        </div>
      </div>` : `
      <div class="tarjeta"><div class="vacio">
        Sin noches registradas todavía.
      </div></div>`}`;
}

async function guardarSueno() {
  const horas = Number(document.getElementById("s-horas").value);
  try {
    await api("/salud/sueno", { method: "POST", body: {
      horas, fecha: document.getElementById("s-fecha").value
    }});
    verSueno();
  } catch (err) {
    document.getElementById("s-msg").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

/* ── Dispositivos ─────────────────────────────────────────────────── */

const ICONO_DISP = {
  banda_pecho: '<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',

const NOMBRE_BIO = {
  pulso: "Ritmo cardíaco", presion: "Presión arterial", pasos: "Pasos",
  calorias: "Calorías", sueno_min: "Sueño", spo2: "Oxígeno en sangre", vo2max: "VO₂ máx"
};

/**
 * Conexión directa por Bluetooth.
 *
 * Usa el servicio `heart_rate` del estándar Bluetooth, que implementan
 * la mayoría de las bandas de pecho y pulseras. Al ser un estándar, no
 * hace falta la API de ninguna marca: ni cuenta de desarrollador, ni
 * clave, ni aprobación, ni pagarle a nadie.
 */
let dispositivoBT = null, ultimoGuardado = 0;

async function conectarBluetooth() {
  const btn = document.getElementById("btn-bt");
  btn.disabled = true; btn.textContent = "Buscando…";

  try {
    const disp = await navigator.bluetooth.requestDevice({
      filters: [{ services: ["heart_rate"] }],
      optionalServices: ["battery_service", "device_information"]
    });

    const servidor = await disp.gatt.connect();
    const servicio = await servidor.getPrimaryService("heart_rate");
    const caract = await servicio.getCharacteristic("heart_rate_measurement");

    await caract.startNotifications();
    caract.addEventListener("characteristicvaluechanged", alLlegarPulso);
    dispositivoBT = disp;

    disp.addEventListener("gattserverdisconnected", () => {
      document.getElementById("lectura-viva").innerHTML =
        `<div class="aviso alerta">Se desconectó ${esc(disp.name || "el dispositivo")}.</div>`;
      dispositivoBT = null;
    });

    await api("/salud/dispositivos", { method: "POST", body: {
      nombre: disp.name || "Sensor de pulso", tipo: "banda_pecho",
      via: "bluetooth", identificador: disp.id
    }}).catch(() => {});

    btn.textContent = "Conectado";
  } catch (err) {
    btn.disabled = false; btn.textContent = "Buscar dispositivo";
    // Cancelar el diálogo no es un error que haya que reportar.
    if (err && err.name === "NotFoundError") return;
    document.getElementById("lectura-viva").innerHTML =
      `<div class="aviso mal">No se pudo conectar: ${esc(err.message || "error desconocido")}</div>`;
  }
}

/**
 * Interpreta la lectura según el estándar.
 *
 * El primer byte dice si el pulso viene en uno o dos bytes. Asumir
 * siempre uno funciona hasta que alguien pasa de 255 pulsaciones... o
 * hasta que un fabricante decide usar dos bytes igual, que pasa seguido.
 */
function alLlegarPulso(evento) {
  const v = evento.target.value;
  const banderas = v.getUint8(0);
  const bpm = (banderas & 0x01) ? v.getUint16(1, true) : v.getUint8(1);
  if (!bpm || bpm < 25 || bpm > 240) return;

  pintarPulso(bpm);

  // Se guarda una lectura por minuto: a una por segundo, una hora de
  // entrenamiento serían 3600 filas que no aportan nada.
  const ahora = Date.now();
  if (ahora - ultimoGuardado > 60000) {
    ultimoGuardado = ahora;
    api("/progreso/" + usuario.id + "/biometria", { method: "POST", body: {
      tipo: "pulso", valor: bpm, origen: "bluetooth",
      medido_en: new Date().toISOString()
    }}).catch(() => {});
  }
}

function pintarPulso(bpm) {
  // Zonas sobre la frecuencia máxima estimada (220 menos la edad). Es
  // una fórmula gruesa y por eso las zonas se muestran anchas.
  const edad = 30;
  const fcMax = 220 - edad;
  const pct = (bpm / fcMax) * 100;
  const zona = pct < 60 ? 1 : pct < 70 ? 2 : pct < 80 ? 3 : pct < 90 ? 4 : 5;
  const nombres = ["", "Muy suave", "Suave", "Moderada", "Fuerte", "Máxima"];
  const colores = ["", "#7d8b99", "#3fb27f", "#4a8ee0", "#d8973c", "#d9534f"];

  document.getElementById("lectura-viva").innerHTML = `
    <div class="vivo">
      <div style="font-size:12px; text-transform:uppercase; letter-spacing:1px;
                  color:var(--tx3); margin-bottom:8px">En vivo</div>
      <div class="bpm"><span class="latido">♥</span> ${bpm} <small>bpm</small></div>
      <div style="margin-top:10px; font-size:13.5px; font-weight:650; color:${colores[zona]}">
        Zona ${zona} · ${nombres[zona]}
      </div>
      <div class="zona" style="color:${colores[zona]}">
        ${[1,2,3,4,5].map(z => `<div class="${z <= zona ? "on" : ""}"></div>`).join("")}
      </div>
    </div>`;
}

/* ── Importación ──────────────────────────────────────────────────── */

let porImportar = null;

function revisarArchivo(entrada) {
  const archivo = entrada.files[0];
  if (!archivo) return;

  const msg = document.getElementById("imp-msg");
  msg.innerHTML = `<div class="aviso info">Leyendo ${esc(archivo.name)}…</div>`;

  const lector = new FileReader();
  lector.onload = async () => {
    try {
      const r = await api("/salud/importar/revisar", { method: "POST", body: {
        nombre: archivo.name, contenido: lector.result
      }});
      porImportar = r.lecturas;

      const tipos = Object.entries(r.por_tipo);
      msg.innerHTML = `
        <div class="aviso ok">
          <b>${esc(archivo.name)} · formato ${esc(r.formato)}</b>
          Se entendieron ${r.total} lecturas${r.actividades ? ` y ${r.actividades} actividades` : ""}.
        </div>
        ${tipos.length ? `<div style="margin:12px 0">
          ${tipos.map(([t, d]) => `
            <div style="display:flex; justify-content:space-between; font-size:13px; padding:5px 0">
              <span>${esc(NOMBRE_BIO[t] || t)}</span>
              <span><b>${d.n}</b> · desde ${fecha(d.desde)}</span>
            </div>`).join("")}
        </div>` : ""}
        ${r.columnas_ignoradas && r.columnas_ignoradas.length ? `
          <p style="font-size:12px; color:var(--tx3); margin-bottom:12px">
            Columnas que no se reconocieron y se ignoran:
            ${r.columnas_ignoradas.map(esc).join(", ")}.
          </p>` : ""}
        ${r.total > 0
          ? `<button class="btn" onclick="confirmarImportar()" style="width:100%">
               Importar ${r.total} lecturas</button>`
          : `<div class="aviso alerta">No se encontró ningún dato aprovechable en el archivo.</div>`}`;
    } catch (err) {
      msg.innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
    }
    entrada.value = "";
  };
  lector.onerror = () => { msg.innerHTML = `<div class="aviso mal">No se pudo leer el archivo.</div>`; };
  lector.readAsText(archivo);
}

async function confirmarImportar() {
  const msg = document.getElementById("imp-msg");
  msg.innerHTML = `<div class="aviso info">Importando…</div>`;
  try {
    const r = await api("/salud/importar/confirmar", { method: "POST", body: { lecturas: porImportar }});
    msg.innerHTML = `<div class="aviso ok">
      <b>Listo</b>
      ${r.biometria} lecturas y ${r.mediciones} mediciones corporales.
      ${r.saltadas ? `${r.saltadas} se saltaron por estar repetidas o incompletas.` : ""}
    </div>`;
    porImportar = null;
    cargados.sueno = false;
  } catch (err) {
    msg.innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

/**
 * Reduce la foto antes de subirla.
 *
 * Una foto de teléfono pesa varios megabytes, y ninguno de esos píxeles
 * sirve para comparar dos siluetas. Se reduce en el navegador: sube más
 * rápido, ocupa menos y no gasta los datos de nadie.
 */
function subirFoto(entrada) {
  const archivo = entrada.files[0];
  if (!archivo) return;

  const msg = document.getElementById("foto-msg");
  msg.innerHTML = `<div class="aviso info">Preparando la foto…</div>`;

  const lector = new FileReader();
  lector.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const maxLado = 900;
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const lienzo = document.createElement("canvas");
      lienzo.width = Math.round(img.width * escala);
      lienzo.height = Math.round(img.height * escala);
      lienzo.getContext("2d").drawImage(img, 0, 0, lienzo.width, lienzo.height);

      try {
        await api("/salud/fotos", { method: "POST", body: {
          imagen: lienzo.toDataURL("image/jpeg", 0.82),
          angulo: document.getElementById("foto-angulo").value,
          fecha: hoyISO()
        }});
        msg.innerHTML = "";
        verFotos();
        mostrarNivel();
      } catch (err) {
        msg.innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
      }
    };
    img.onerror = () => { msg.innerHTML = `<div class="aviso mal">No se pudo leer la imagen.</div>`; };
    img.src = lector.result;
  };
  lector.readAsDataURL(archivo);
  entrada.value = "";
}

async function borrarFoto(id) {
  if (!confirm("¿Borrar esta foto? No se puede deshacer.")) return;
  try { await api("/salud/fotos/" + id, { method: "DELETE" }); verFotos(); }
  catch (err) { alert(err.message); }
}
