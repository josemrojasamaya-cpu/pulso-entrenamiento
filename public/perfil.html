<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131920">
<title>Pulso · Perfil</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
.seccion{margin-bottom:20px}
.seccion>h2{font-size:15px; font-weight:650; margin-bottom:4px}
.seccion>p.ayuda{font-size:13px; color:var(--tx2); margin-bottom:13px; line-height:1.55}
.limites{
  background:var(--gr-850); border:1px solid var(--borde);
  border-radius:10px; padding:14px 16px; margin-top:14px; font-size:13px; line-height:1.65;
}
.limites b{color:var(--tx); display:block; margin-bottom:6px; font-size:12px;
  text-transform:uppercase; letter-spacing:.5px}
.limites ul{margin:8px 0 0 18px; color:var(--tx2)}
.limites li{margin-bottom:4px}
</style>
</head>
<body>

<header class="top" id="top"></header>

<main class="pagina">
  <div class="titulo">
    <h1>Tu perfil</h1>
    <p>De acá salen todas las decisiones del sistema. Vale la pena que esté al día.</p>
  </div>
  <div id="plan"></div>
  <div id="contenido"><div class="cargando">Cargando…</div></div>
</main>

<nav class="tabs" id="tabs"></nav>

<script src="almacen.js"></script>
<script src="comun.js"></script>
<script>
const usuario = Sesion.exigir();
let perfil = null, condicionesActivas = [], catalogoCond = [];

const EQUIPOS = [
  ["peso_corporal","Peso corporal"], ["mancuernas","Mancuernas"], ["barra","Barra"],
  ["maquina","Máquinas"], ["polea","Poleas"], ["banda","Bandas elásticas"], ["kettlebell","Kettlebell"]
];

async function cargar() {
  pintarEstructura("perfil");
  verPlan();
  try {
    const [datos, catalogo] = await Promise.all([
      api(`/atleta/${usuario.id}/perfil`),
      api("/atleta/condiciones/catalogo")
    ]);
    perfil = datos.perfil || {};
    condicionesActivas = (datos.condiciones || []).map(c => c.codigo);
    catalogoCond = catalogo;
    pintar(datos.limites);
    cargarBloque();
  } catch (err) {
    document.getElementById("contenido").innerHTML =
      `<div class="aviso ${err.sinRed ? "alerta" : "mal"}">${esc(err.message)}</div>`;
  }
}

function pintar(limites) {
  const equipo = Array.isArray(perfil.equipo) ? perfil.equipo : ["peso_corporal"];
  const equipoCasa = Array.isArray(perfil.equipo_casa) ? perfil.equipo_casa : ["peso_corporal"];

  document.getElementById("contenido").innerHTML = `
    <div class="tarjeta" style="margin-bottom:16px"><div class="t-cu">
      <div class="seccion">
        <h2>Qué buscás</h2>
        <p class="ayuda">Define el rango de repeticiones, las series y el descanso de cada sesión.</p>
        <label class="campo"><span>Objetivo</span>
          <select id="p-objetivo">
            ${Object.entries(NOMBRE_OBJETIVO).map(([v,t]) =>
              `<option value="${v}" ${perfil.objetivo===v?"selected":""}>${t}</option>`).join("")}
          </select>
        </label>
        <label class="campo"><span>Tu nivel</span>
          <select id="p-nivel">
            <option value="principiante" ${perfil.nivel==="principiante"?"selected":""}>Principiante — menos de 6 meses entrenando</option>
            <option value="intermedio"   ${perfil.nivel==="intermedio"?"selected":""}>Intermedio — de 6 meses a 2 años</option>
            <option value="avanzado"     ${perfil.nivel==="avanzado"?"selected":""}>Avanzado — más de 2 años sostenidos</option>
          </select>
        </label>
      </div>

      <div class="seccion">
        <h2>Cuánto podés entrenar</h2>
        <p class="ayuda">Con pocos días conviene cuerpo completo; con muchos, repartir por grupos. El sistema lo decide con esto.</p>
        <div class="rejilla r-2">
          <label class="campo"><span>Días por semana</span>
            <select id="p-dias">
              ${[1,2,3,4,5,6,7].map(d => `<option value="${d}" ${perfil.dias_por_semana===d?"selected":""}>${d} día${d>1?"s":""}</option>`).join("")}
            </select>
          </label>
          <label class="campo"><span>Minutos por sesión</span>
            <select id="p-minutos">
              ${[20,30,45,60,75,90].map(m => `<option value="${m}" ${perfil.minutos_sesion===m?"selected":""}>${m} minutos</option>`).join("")}
            </select>
          </label>
        </div>
      </div>

      <div class="seccion">
        <h2>Qué equipo tenés en el gimnasio</h2>
        <p class="ayuda">Sólo se van a proponer ejercicios que puedas hacer de verdad. Marcar equipo que no tenés es la forma más rápida de terminar con una rutina inservible.</p>
        <div class="fichas" id="fichas-equipo">
          ${EQUIPOS.map(([v,t]) => `
            <label class="ficha ${equipo.includes(v)?"on":""}">
              <input type="checkbox" value="${v}" ${equipo.includes(v)?"checked":""}
                     onchange="this.closest('.ficha').classList.toggle('on', this.checked)">
              ${t}
            </label>`).join("")}
        </div>
      </div>

      <div class="seccion">
        <h2>Y qué tenés en casa</h2>
        <p class="ayuda">
          El día que no puedas ir al gimnasio, la sesión se rehace con esto. Aunque sólo
          marques el peso corporal ya alcanza: hay 49 ejercicios que no necesitan nada.
        </p>
        <div class="fichas" id="fichas-casa">
          ${EQUIPOS.map(([v,t]) => `
            <label class="ficha ${equipoCasa.includes(v)?"on":""}">
              <input type="checkbox" value="${v}" ${equipoCasa.includes(v)?"checked":""}
                     onchange="this.closest('.ficha').classList.toggle('on', this.checked)">
              ${t}
            </label>`).join("")}
        </div>
      </div>

      <div class="seccion">
        <h2>Datos físicos</h2>
        <div class="rejilla r-2">
          <label class="campo"><span>Altura (cm)</span>
            <input type="number" id="p-altura" value="${perfil.altura_cm ?? ""}" placeholder="175"></label>
          <label class="campo"><span>Fecha de nacimiento</span>
            <input type="date" id="p-nac" value="${perfil.fecha_nacimiento ? String(perfil.fecha_nacimiento).slice(0,10) : ""}"></label>
        </div>
        <label class="campo"><span>Sexo</span>
          <select id="p-sexo">
            <option value="">Prefiero no decirlo</option>
            <option ${perfil.sexo==="Femenino"?"selected":""}>Femenino</option>
            <option ${perfil.sexo==="Masculino"?"selected":""}>Masculino</option>
          </select>
        </label>
      </div>

      <button class="btn grande" onclick="guardarPerfil()">Guardar perfil</button>
      <div id="msg-perfil" style="margin-top:12px"></div>
    </div></div>

    <div class="tarjeta" style="margin-bottom:16px"><div class="t-cu">
      <div class="seccion">
        <h2>Bloque de entrenamiento</h2>
        <p class="ayuda">
          Entrenar siempre igual deja de funcionar: el cuerpo se adapta a lo que se
          repite. Un bloque organiza el esfuerzo en semanas que suben y una que baja
          —la descarga—, que es cuando el cuerpo asimila lo anterior.
        </p>
        <div id="bloque-actual"></div>
        <label class="campo" style="margin-top:14px"><span>Modelo</span>
          <select id="p-modelo"></select>
        </label>
        <div id="modelo-desc" style="font-size:12.5px; color:var(--tx2); line-height:1.55; margin-bottom:14px"></div>
        <div style="display:flex; gap:9px">
          <button class="btn" onclick="iniciarBloque()" style="flex:1">Iniciar bloque</button>
          <button class="btn sec" id="btn-cerrar-bloque" onclick="cerrarBloque()" style="display:none">Cerrar</button>
        </div>
        <div id="msg-bloque" style="margin-top:12px"></div>
      </div>
    </div></div>

    <div class="tarjeta"><div class="t-cu">
      <div class="seccion">
        <h2>Condiciones de salud</h2>
        <p class="ayuda">
          Esto es lo más importante de esta pantalla. Determina qué ejercicios quedan excluidos,
          cuánta carga como máximo y qué avisos vas a ver antes de entrenar.
          Si no aplica ninguna, dejalo vacío.
        </p>
        <div class="fichas" id="fichas-cond">
          ${catalogoCond.map(c => `
            <label class="ficha ${condicionesActivas.includes(c.codigo)?"on":""}">
              <input type="checkbox" value="${c.codigo}" ${condicionesActivas.includes(c.codigo)?"checked":""}
                     onchange="this.closest('.ficha').classList.toggle('on', this.checked)">
              ${esc(c.nombre)}
            </label>`).join("")}
        </div>

        <div class="aviso alerta" style="margin-top:16px">
          Esto no reemplaza a tu médico. El sistema aplica criterios generales de seguridad;
          si tenés una condición importante, que un profesional autorice tu plan antes de empezar.
        </div>

        <div id="limites">${pintarLimites(limites)}</div>

        <button class="btn grande" onclick="guardarCondiciones()" style="margin-top:14px">Guardar condiciones</button>
        <div id="msg-cond" style="margin-top:12px"></div>
      </div>
    </div></div>`;
}

function pintarLimites(l) {
  if (!l || !l.condiciones || l.condiciones.length === 0) {
    return `<div class="limites">
      <b>Sin restricciones activas</b>
      Se aplican los rangos normales de tu objetivo, sin topes de intensidad.
    </div>`;
  }
  return `<div class="limites">
    <b>Cómo queda tu entrenamiento</b>
    Por ${l.condiciones.map(c=>esc(c.nombre)).join(" y ")}:
    <ul>
      <li>Intensidad topada al <strong style="color:var(--tx)">${Math.round(l.intensidadMax*100)}%</strong> de tu carga máxima estimada.</li>
      <li>Repeticiones desde <strong style="color:var(--tx)">${l.repMin}</strong> hacia arriba, para bajar la carga por repetición.</li>
      <li>Descanso mínimo de <strong style="color:var(--tx)">${l.descansoMin} segundos</strong> entre series.</li>
      ${l.sinImpacto ? "<li>Sin saltos ni carrera.</li>" : ""}
      ${l.evitarPatrones.length ? `<li>Se excluyen los patrones: ${l.evitarPatrones.join(", ")}.</li>` : ""}
      <li>Vas a ver <strong style="color:var(--tx)">${l.avisos.length} avisos</strong> de seguridad antes de cada sesión.</li>
    </ul>
  </div>`;
}

/**
 * Envuelve una acción para que no se pueda disparar dos veces seguidas.
 * El botón queda bloqueado y avisa mientras la petición está en curso.
 */
async function unaVez(selector, textoOcupado, accion) {
  const boton = document.querySelector(selector);
  if (boton && boton.disabled) return;
  const previo = boton ? boton.textContent : null;
  if (boton) { boton.disabled = true; boton.textContent = textoOcupado; }
  try { await accion(); }
  finally { if (boton) { boton.disabled = false; boton.textContent = previo; } }
}

function marcados(contenedor) {
  return [...document.querySelectorAll(`#${contenedor} input:checked`)].map(i => i.value);
}

function guardarPerfil() {
  return unaVez("#contenido .tarjeta .btn.grande", "Guardando…", guardarPerfilAhora);
}

async function guardarPerfilAhora() {
  const equipo = marcados("fichas-equipo");
  if (equipo.length === 0) {
    document.getElementById("msg-perfil").innerHTML =
      `<div class="aviso mal">Marcá al menos una opción de equipo. Con sólo peso corporal ya alcanza.</div>`;
    return;
  }

  const equipoCasa = marcados("fichas-casa");
  if (equipoCasa.length === 0) equipoCasa.push("peso_corporal");

  const cuerpo = {
    equipo_casa: equipoCasa,
    objetivo: document.getElementById("p-objetivo").value,
    nivel: document.getElementById("p-nivel").value,
    dias_por_semana: Number(document.getElementById("p-dias").value),
    minutos_sesion: Number(document.getElementById("p-minutos").value),
    equipo,
    altura_cm: document.getElementById("p-altura").value || null,
    fecha_nacimiento: document.getElementById("p-nac").value || null,
    sexo: document.getElementById("p-sexo").value || null
  };

  try {
    await api(`/atleta/${usuario.id}/perfil`, { method:"PUT", body: cuerpo });
    document.getElementById("msg-perfil").innerHTML =
      `<div class="aviso ok">Perfil guardado. La rutina de mañana ya sale con estos datos.</div>`;
  } catch (err) {
    document.getElementById("msg-perfil").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

function guardarCondiciones() {
  return unaVez("#msg-cond", "Guardando…", guardarCondicionesAhora);
}

async function guardarCondicionesAhora() {
  try {
    const r = await api(`/atleta/${usuario.id}/condiciones`, {
      method:"PUT", body: { condiciones: marcados("fichas-cond") }
    });
    document.getElementById("limites").innerHTML = pintarLimites(r.limites);
    document.getElementById("msg-cond").innerHTML =
      `<div class="aviso ok">Condiciones guardadas. Los ejercicios contraindicados dejan de aparecer desde la próxima rutina.</div>`;
  } catch (err) {
    document.getElementById("msg-cond").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

/* ── Bloque de entrenamiento ──────────────────────────────────────── */

let modelos = [];

async function cargarBloque() {
  try {
    const d = await api(`/atleta/${usuario.id}/mesociclo`);
    modelos = d.modelos || [];
    const elegido = d.mesociclo ? d.mesociclo.modelo : d.sugerido;

    const sel = document.getElementById("p-modelo");
    sel.innerHTML = modelos.map(m => `
      <option value="${m.codigo}" ${m.codigo === elegido ? "selected" : ""}>
        ${esc(m.nombre)} · ${m.semanas} semana${m.semanas > 1 ? "s" : ""}${
          m.codigo === d.sugerido ? " (recomendado para vos)" : ""}
      </option>`).join("");
    sel.onchange = pintarDescripcion;
    pintarDescripcion();

    document.getElementById("btn-cerrar-bloque").style.display = d.mesociclo ? "" : "none";
    const caja = document.getElementById("bloque-actual");

    if (!d.mesociclo || !d.semana) {
      caja.innerHTML = `<div class="aviso info">
        No tenés ningún bloque activo. Las sesiones salen sin variación semanal.
      </div>`;
      return;
    }

    const s = d.semana;
    caja.innerHTML = `
      <div class="aviso ${s.descarga ? "alerta" : "info"}">
        <b>${esc(d.mesociclo.nombre)} · semana ${s.numero} de ${s.de}${
          s.ciclo > 1 ? ` (ciclo ${s.ciclo})` : ""}</b>
        ${esc(s.nota)}
        <div style="margin-top:7px; font-size:12.5px; opacity:.85">
          Volumen ${Math.round(s.volumen * 100)}% · intensidad ${Math.round(s.intensidad * 100)}%
        </div>
      </div>`;
  } catch (err) {
    document.getElementById("bloque-actual").innerHTML =
      `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

function pintarDescripcion() {
  const m = modelos.find(x => x.codigo === document.getElementById("p-modelo").value);
  document.getElementById("modelo-desc").textContent = m ? m.descripcion : "";
}

function iniciarBloque() {
  return unaVez("#msg-bloque", "Iniciando…", iniciarBloqueAhora);
}

async function iniciarBloqueAhora() {
  try {
    const r = await api(`/atleta/${usuario.id}/mesociclo`, {
      method: "POST", body: { modelo: document.getElementById("p-modelo").value }
    });
    document.getElementById("msg-bloque").innerHTML =
      `<div class="aviso ok">Bloque iniciado.${
        r.rutinas_rehechas ? ` Se rehará el plan de los próximos ${r.rutinas_rehechas} día(s).` : ""}</div>`;
    cargarBloque();
  } catch (err) {
    document.getElementById("msg-bloque").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

async function cerrarBloque() {
  if (!confirm("¿Cerrar el bloque actual? Las sesiones vuelven a salir sin variación semanal.")) return;
  try {
    await api(`/atleta/${usuario.id}/mesociclo`, { method: "DELETE" });
    document.getElementById("msg-bloque").innerHTML = `<div class="aviso ok">Bloque cerrado.</div>`;
    cargarBloque();
  } catch (err) {
    document.getElementById("msg-bloque").innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  }
}

cargar();

/* ── Plan y cupones ───────────────────────────────────────────────── */

async function verPlan() {
  let p;
  try { p = await api("/cupones/mi-plan"); } catch (err) { return; }

  const z = document.getElementById("plan");
  const completo = p.vigente && p.plan !== "gratis";

  z.innerHTML = `
    <div class="tarjeta" style="margin-bottom:16px">
      <div class="t-cab"><h2>Tu plan</h2></div>
      <div class="t-cu">
        <div style="display:flex; align-items:center; gap:13px; margin-bottom:16px">
          <div style="width:44px; height:44px; border-radius:12px; flex:none; display:grid;
                      place-items:center; font-size:20px;
                      background:${completo ? "var(--ok-tenue)" : "var(--gr-750)"};
                      border:1px solid ${completo ? "var(--ok-3)" : "var(--borde)"}">
            ${completo ? "★" : "○"}
          </div>
          <div style="flex:1">
            <b style="display:block; font-size:15px">${completo ? "Acceso completo" : "Plan gratuito"}</b>
            <span style="font-size:12.5px; color:var(--tx3)">
              ${completo
                ? `${p.dias_restantes} ${p.dias_restantes === 1 ? "día" : "días"} restantes`
                : "Todo lo esencial, sin costo"}
            </span>
          </div>
        </div>

        <label class="campo"><span>¿Tenés un código?</span>
          <input type="text" id="cupon" placeholder="PULSO-..." autocapitalize="characters"
                 style="text-transform:uppercase; letter-spacing:.5px">
        </label>
        <button class="btn" onclick="canjear()" style="width:100%">Canjear código</button>
        <div id="cupon-msg" style="margin-top:10px"></div>
      </div>
    </div>`;
}

async function canjear() {
  const campo = document.getElementById("cupon");
  const msg = document.getElementById("cupon-msg");
  const codigo = campo.value.trim();
  if (!codigo) { campo.focus(); return; }

  const boton = event.target;
  if (boton.disabled) return;
  boton.disabled = true;
  const antes = boton.textContent;
  boton.textContent = "Canjeando…";

  try {
    const r = await api("/cupones/canjear", { method: "POST", body: { codigo } });
    msg.innerHTML = `<div class="aviso ok">${esc(r.mensaje)}</div>`;
    campo.value = "";
    // Se vuelve a leer del servidor en vez de suponer el nuevo estado:
    // el plan pudo sumarse a días que ya tenía, y ese número lo sabe la
    // base, no la pantalla.
    setTimeout(verPlan, 900);
  } catch (err) {
    msg.innerHTML = `<div class="aviso mal">${esc(err.message)}</div>`;
  } finally {
    boton.disabled = false;
    boton.textContent = antes;
  }
}
</script>
</body>
</html>
