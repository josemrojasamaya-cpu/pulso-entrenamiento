<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000"
     preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    Fondo de la aplicación: silueta a contraluz de alguien sosteniendo
    una barra cargada sobre los hombros, al final de una sentadilla.

    Tres decisiones de composición:

    1. CONTRALUZ. Una silueta negra sobre fondo oscuro no se ve —es negro
       sobre negro—, así que detrás va un foco que la recorta. Es la
       lámpara del fondo del gimnasio.

    2. FIGURA PESADA. Espalda ancha, trapecio marcado, brazos gruesos y
       la barra combada por el peso, con cuatro discos por lado. Una
       silueta esbelta se lee como ilustración; ésta tiene que leerse
       como esfuerzo.

    3. AMBIENTE SUCIO. Polvo de magnesio suspendido en el haz, vetas de
       luz y grano encima de todo. Un degradado limpio se ve a software;
       un gimnasio de verdad tiene polvo.
  -->
  <defs>
    <linearGradient id="ambiente" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#101d2b"/>
      <stop offset="42%"  stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#04070b"/>
    </linearGradient>

    <radialGradient id="contraluz" cx="0.5" cy="0.44" r="0.46">
      <stop offset="0%"   stop-color="#cfe4fb" stop-opacity=".92"/>
      <stop offset="14%"  stop-color="#7db4f0" stop-opacity=".64"/>
      <stop offset="38%"  stop-color="#3d7fd6" stop-opacity=".34"/>
      <stop offset="68%"  stop-color="#1b3c6b" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#0a121c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="piso-luz" cx="0.5" cy="1" r="0.6">
      <stop offset="0%"   stop-color="#4a8ee0" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#4a8ee0" stop-opacity="0"/>
    </radialGradient>

    <!-- Filo de luz: intenso arriba, donde pega el foco. -->
    <linearGradient id="filo" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#e8f2ff" stop-opacity=".95"/>
      <stop offset="35%"  stop-color="#8dc0f4" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#2c62aa" stop-opacity=".2"/>
    </linearGradient>

    <!-- Grano: quita el aspecto de degradado limpio. -->
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>

    <filter id="difuso" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1900" height="1000" fill="url(#ambiente)"/>

  <!-- Vetas del haz de luz, en diagonal desde el foco -->
  <g opacity=".2" fill="#8dc0f4">
    <polygon points="1380,0 1470,0 1180,1000 1010,1000"/>
    <polygon points="1560,0 1600,0 1420,1000 1330,1000"/>
    <polygon points="1240,0 1268,0 1010,1000 940,1000"/>
  </g>

  <ellipse cx="1300" cy="500" rx="500" ry="450" fill="url(#contraluz)"/>
  <ellipse cx="1300" cy="930" rx="440" ry="130" fill="url(#piso-luz)"/>

  <!-- Polvo de magnesio suspendido en el haz -->
  <g fill="#cfe4fb" opacity=".5">
    <circle cx="1250" cy="300" r="2.5"/><circle cx="1330" cy="215" r="1.8"/>
    <circle cx="1490" cy="270" r="2.2"/><circle cx="1580" cy="360" r="1.6"/>
    <circle cx="1200" cy="430" r="1.9"/><circle cx="1620" cy="480" r="2.4"/>
    <circle cx="1300" cy="540" r="1.5"/><circle cx="1530" cy="600" r="2"/>
    <circle cx="1400" cy="180" r="2.1"/><circle cx="1170" cy="620" r="1.7"/>
    <circle cx="1660" cy="240" r="1.4"/><circle cx="1450" cy="700" r="1.8"/>
  </g>

  <g transform="translate(1300 585) scale(0.8) translate(-600 -520)">

    <!-- Halo detrás de la figura: la despega del fondo -->
    <ellipse cx="600" cy="440" rx="230" ry="300" fill="#7db4f0" opacity=".2" filter="url(#difuso)"/>

    <g fill="#03060a">

      <!-- ── Barra sobre los trapecios, combada por el peso ── -->
      <path d="M250 330 Q600 358 950 330 L950 350 Q600 378 250 350 Z"/>
      <!-- Discos: cuatro por lado, apilados -->
      <rect x="214" y="238" width="34" height="196" rx="17"/>
      <rect x="172" y="258" width="30" height="156" rx="15"/>
      <rect x="136" y="278" width="26" height="116" rx="13"/>
      <rect x="106" y="296" width="22" height="80"  rx="11"/>
      <rect x="952" y="238" width="34" height="196" rx="17"/>
      <rect x="998" y="258" width="30" height="156" rx="15"/>
      <rect x="1038" y="278" width="26" height="116" rx="13"/>
      <rect x="1072" y="296" width="22" height="80"  rx="11"/>

      <!-- ── Cabeza, hundida entre los hombros ── -->
      <circle cx="600" cy="262" r="46"/>
      <rect x="574" y="296" width="52" height="30" rx="16"/>

      <!-- ── Trapecio y hombros: la parte que define el volumen ── -->
      <path d="M600 316
               c-64 0 -122 16 -160 44
               c-30 22 -48 48 -54 78
               l-10 50
               h448
               l-10 -50
               c-6 -30 -24 -56 -54 -78
               c-38 -28 -96 -44 -160 -44 Z"/>

      <!-- ── Dorsal: se abre en V desde la cintura ── -->
      <path d="M424 488
               h352
               l-16 118
               c-6 40 -26 68 -58 80
               l-20 8
               h-164
               l-20 -8
               c-32 -12 -52 -40 -58 -80
               Z"/>

      <!-- ── Brazos sosteniendo la barra ── -->
      <path d="M436 352
               c-40 -6 -74 4 -96 30
               l-40 46
               c-16 18 -12 40 8 48
               c18 8 36 0 46 -16
               l30 -42
               c14 -18 40 -26 66 -22 Z"/>
      <path d="M764 352
               c40 -6 74 4 96 30
               l40 46
               c16 18 12 40 -8 48
               c-18 8 -36 0 -46 -16
               l-30 -42
               c-14 -18 -40 -26 -66 -22 Z"/>

      <!-- ── Cadera ── -->
      <path d="M460 690 h280 l16 62 c4 18 -8 30 -28 30 h-256 c-20 0 -32 -12 -28 -30 Z"/>

      <!-- ── Muslos: gruesos, ligeramente flexionados ── -->
      <path d="M498 780
               c-34 4 -58 26 -66 60
               l-26 130
               c-4 22 10 38 34 38
               c22 0 36 -12 40 -34
               l24 -122
               c4 -18 18 -30 38 -32 Z"/>
      <path d="M702 780
               c34 4 58 26 66 60
               l26 130
               c4 22 -10 38 -34 38
               c-22 0 -36 -12 -40 -34
               l-24 -122
               c-4 -18 -18 -30 -38 -32 Z"/>

      <!-- ── Pantorrillas ── -->
      <path d="M440 1008 l-8 62 h72 l10 -64 c-24 8 -50 8 -74 2 Z"/>
      <path d="M760 1008 l8 62 h-72 l-10 -64 c24 8 50 8 74 2 Z"/>
    </g>

    <!-- ── Filo de luz sobre el contorno ── -->
    <g fill="none" stroke="url(#filo)" stroke-linecap="round">
      <g stroke-width="6">
        <path d="M554 266 a46 46 0 0 1 46 -46"/>
        <path d="M440 360 c38 -28 96 -44 160 -44"/>
        <path d="M424 488 l-16 118"/>
        <path d="M436 352 c-40 -6 -74 4 -96 30 l-40 46"/>
        <path d="M498 780 c-34 4 -58 26 -66 60 l-26 130"/>
      </g>
      <g stroke-width="4" opacity=".62">
        <path d="M646 266 a46 46 0 0 0 -46 -46"/>
        <path d="M760 360 c-38 -28 -96 -44 -160 -44"/>
        <path d="M776 488 l16 118"/>
        <path d="M764 352 c40 -6 74 4 96 30 l40 46"/>
        <path d="M702 780 c34 4 58 26 66 60 l26 130"/>
      </g>
      <!-- Brillo sobre la barra combada -->
      <path d="M250 336 Q600 364 950 336" stroke-width="4" opacity=".72"/>
    </g>
  </g>

  <!-- Trazo de latido, cruzando la escena -->
  <path d="M-400 782 H300 L340 690 L392 872 L444 636 L496 800 L536 782 H2200"
        fill="none" stroke="#4a8ee0" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" opacity=".4"/>

  <!-- Piso -->
  <rect x="60" y="944" width="1780" height="2" fill="#4a8ee0" opacity=".3"/>

  <!-- Grano encima de todo -->
  <rect width="1900" height="1000" filter="url(#grano)" opacity=".85"/>
</svg>
